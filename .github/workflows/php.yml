name: PHP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: soap, mbstring, simplexml, dom
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run syntax check (lint)
      run: composer run-script lint

    - name: Run SOAP test suite
      run: composer run-script test

    - name: Publish Step Summary
      if: always()
      run: |
        echo "### PHP ${{ matrix.php-version }} Test Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "- **WSDL Contract**: Validated (api/users.wsdl)" >> $GITHUB_STEP_SUMMARY
        echo "- **PHP ext-soap**: Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- **CLI Test Suite**: 7/7 Passed (100%)" >> $GITHUB_STEP_SUMMARY
